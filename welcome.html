<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LPay Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
:root{--green:#1dce9f;--bg:#1b1b1b;--card:#242424;--border:#333}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:21px;padding:28px;width:100%;max-width:400px;text-align:center}
.logo-img{width:70px;height:70px;border-radius:18px;object-fit:cover;margin:0 auto 20px;display:block}
h1{font-size:24px;font-weight:800}
.sub{color:#999;font-size:12px;margin-top:8px;line-height:1.6}
.expiry-box{background:#1b1b1b;border:1px solid #383838;border-radius:14px;padding:17px;margin-top:21px}
.expiry-box small{color:#999;font-size:9px;letter-spacing:1px}
.expiry-box h3{color:var(--green);font-size:18px;margin-top:8px}
.email{background:#303030;border-radius:10px;padding:12px;margin-top:16px;font-size:11px;color:#aaa;word-break:break-all}
.btn{width:100%;min-height:49px;border:none;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;margin-top:15px}
.primary{background:var(--green);color:#111}
.logout{background:#303030;color:#ff7777;border:1px solid #454545}
</style>
</head>
<body>
<div class="card">
<img src="lpay_icon.png" class="logo-img" alt="LPay">
<h1 id="welcome">Welcome!</h1>
<p class="sub">Your LPay account is active and ready.</p>
<div class="expiry-box">
<small>SUBSCRIPTION EXPIRY</small>
<h3 id="expiry">Loading...</h3>
<p class="sub" id="remaining">Checking subscription...</p>
</div>
<div class="email" id="email">loading...</div>
<button class="btn primary" onclick="alert('App unlocked!')">Continue to App →</button>
<button class="btn logout" onclick="logout()">Sign Out</button>
</div>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAhZOxtcG9WEVqCkGYFZQkLyHJE7Gue6AY",
  authDomain: "lpayapp.firebaseapp.com",
  projectId: "lpayapp",
  storageBucket: "lpayapp.firebasestorage.app",
  messagingSenderId: "78413247132",
  appId: "1:78413247132:web:bd275363a2631f4aa57359"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const VERCEL_URL = "https://lpayvercelready.vercel.app";
async function getSubscription(){
  const user=auth.currentUser;
  if(!user) throw new Error("Login required");
  const token=await user.getIdToken();
  const response=await fetch(VERCEL_URL+"/api/getSubscription",{
    method:"GET",
    headers:{Authorization:"Bearer "+token}
  });
  let data={};
  try{data=await response.json();}catch(_){throw new Error("Invalid response from subscription server");}
  if(!response.ok) throw new Error(data.error||"Subscription check failed");
  return data;
}
auth.onAuthStateChanged(async user=>{
  if(!user){ location.href="index.html"; return; }
  document.getElementById('email').innerText=user.email||"";
  try{
    const data = await getSubscription();
    if(!data.active && !data.admin){ location.href="index.html"; return; }
    if(data.admin){
      document.getElementById('welcome').innerText="Welcome, Admin";
      document.getElementById('expiry').innerText="LIFETIME ACCESS";
      document.getElementById('remaining').innerText="Administrator account";
    }else{
      document.getElementById('welcome').innerText="Welcome, "+(user.displayName||"User").split(" ")[0];
      const expiry = new Date(data.expiry);
      document.getElementById('expiry').innerText=expiry.toLocaleDateString("en-NG",{day:"numeric",month:"long",year:"numeric"});
      const days=Math.max(0,Math.ceil((data.expiry-Date.now())/86400000));
      document.getElementById('remaining').innerText=days+" days remaining";
    }
  }catch(e){
    console.error("LPay subscription check:",e);
    document.getElementById('welcome').innerText="Unable to verify account";
    document.getElementById('expiry').innerText="Please try again";
    document.getElementById('remaining').innerText=e.message||"Connection problem";
  }
});
function logout(){ auth.signOut().then(()=>location.href="index.html"); }
</script>
</body>
</html>
